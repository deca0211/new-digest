<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>뉴스 다이제스트</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1c2430;--sub:#5b6676;--line:#dfe3e9;--accent:#1f5eff;--tag:#e8eefc}
@media (prefers-color-scheme:dark){:root{--bg:#12161c;--card:#1a2029;--text:#e8ecf2;--sub:#97a1b0;--line:#2a3340;--accent:#7aa2ff;--tag:#243252}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 -apple-system,"Pretendard","Noto Sans KR",sans-serif}
main{max-width:720px;margin:0 auto;padding:24px 16px 64px}
h1{font-size:1.5rem;margin:0 0 4px}
.sub{color:var(--sub);margin:0 0 20px;font-size:.9rem}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
input,select{font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text)}
input{flex:1;min-width:180px}
input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
article{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:12px}
article h2{font-size:1.05rem;margin:0 0 6px;line-height:1.4}
article a{color:inherit;text-decoration:none}
article a:hover{color:var(--accent)}
.meta{color:var(--sub);font-size:.82rem;margin-bottom:8px}
.summary{margin:0 0 10px}
.tags span{display:inline-block;background:var(--tag);color:var(--accent);font-size:.78rem;padding:2px 8px;border-radius:99px;margin:0 6px 4px 0}
.empty{color:var(--sub);text-align:center;padding:40px 0}
</style>
</head>
<body>
<main>
  <h1>뉴스 다이제스트</h1>
  <p class="sub" id="status">불러오는 중…</p>
  <div class="bar">
    <input id="q" type="search" placeholder="제목, 요약, 키워드 검색">
    <select id="src"><option value="">전체 출처</option></select>
  </div>
  <div id="list"></div>
</main>
<script>
let all = [];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function render() {
  const q = $("q").value.trim().toLowerCase();
  const src = $("src").value;
  const rows = all.filter(a =>
    (!src || a.source === src) &&
    (!q || [a.title, a.summary, (a.keywords || []).join(" ")].join(" ").toLowerCase().includes(q)));
  $("list").innerHTML = rows.length ? rows.map(a => `
    <article>
      <h2><a href="${esc(a.url)}" target="_blank" rel="noopener noreferrer">${esc(a.title)}</a></h2>
      <div class="meta">${esc(a.source)} · ${esc((a.published || a.collected_at || "").slice(0, 16))}</div>
      ${a.summary ? `<p class="summary">${esc(a.summary)}</p>` : ""}
      <div class="tags">${(a.keywords || []).map(k => `<span>${esc(k)}</span>`).join("")}</div>
    </article>`).join("") : `<p class="empty">조건에 맞는 글이 없어요. 검색어나 출처를 바꿔 보세요.</p>`;
}

fetch("data/articles.json")
  .then(r => r.json())
  .then(d => {
    all = d;
    [...new Set(d.map(a => a.source))].forEach(s => $("src").add(new Option(s, s)));
    $("status").textContent = d.length ? `글 ${d.length}개` : "아직 수집된 글이 없어요. Actions에서 update-news를 실행해 보세요.";
    render();
  })
  .catch(() => $("status").textContent = "데이터를 불러오지 못했어요. 새로고침해 주세요.");
$("q").addEventListener("input", render);
$("src").addEventListener("change", render);
</script>
</body>
</html>
